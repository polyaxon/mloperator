apiVersion: polyaxon.com/v1
kind: Cluster
metadata:
  name: ray-cluster-simple
  namespace: polyaxon-agent
rayClusterSpec:
  rayVersion: '2.46.0'
  head:
    rayStartParams:
      num-cpus: "0"
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.46.0
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 1
              memory: 2Gi
  workers:
  - groupName: small-group
    replicas: 2
    minReplicas: 1
    maxReplicas: 5
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.46.0
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "2Gi"
